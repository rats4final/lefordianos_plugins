// Game mode / Modo de juego: mutation19
exec lefordianos/common.cfg

// Versus: the per-map tank/witch roll is done by lef_boss_spawns, so the game's own roll is set to
// always (otherwise both chances stack). Finales are left alone.
// Versus: el sorteo de tank/witch por mapa lo hace lef_boss_spawns, asi que el sorteo propio del
// juego se pone en "siempre" (si no, las dos probabilidades se suman). Los finales no se tocan.
sm_cvar versus_tank_chance "1"
sm_cvar versus_tank_chance_intro "1"
sm_cvar versus_witch_chance "1"
sm_cvar versus_witch_chance_intro "1"
