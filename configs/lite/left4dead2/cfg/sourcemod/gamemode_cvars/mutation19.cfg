// Game mode / Modo de juego: mutation19 (Taaannnk!!)
exec lefordianos/common.cfg

// Run by lef_tanktime (port of Merc1less' Tank!Time!): every infected is a tank. It sets the
// director's tank/witch chances itself. Its settings: cfg/sourcemod/lef_tanktime.cfg.
// lef_mode_plugins turns off the versus plugins that pick the tank, the class or the bosses
// (list in addons/sourcemod/configs/lef_mode_plugins.cfg). Their cvar lines in common.cfg
// (static_tank_map...) then show "Unknown command" in the console: harmless.
// Lo maneja lef_tanktime (port del Tank!Time! de Merc1less): todos los infectados son tanks.
// lef_mode_plugins apaga los plugins de versus que eligen el tank, la clase o los jefes.

// Tank tips, the "holding an infected" reminder and "attack together" make no sense with only tanks.
// Los consejos de tank, el aviso de "infectado guardado" y "ataquen juntos" no tienen sentido con solo tanks.
sm_cvar lef_hints_tank_tips "0"
sm_cvar lef_hints_hold "0"
sm_cvar lef_hints_solo "0"
