// =====================================================================================
// Lefordianos - example server.cfg / server.cfg de ejemplo
//
// EN: Copy this file to cfg/server.cfg ONCE and fill in your values (look for "CHANGE ME").
//     Updates only ship this example, so your real server.cfg is never overwritten.
//     Built from the competitive repo's server.cfg, Harry Potter's server.cfg and tutorial, and the
//     Valve wiki's cvar list. server.cfg runs on EVERY map change.
// ES: Copia este archivo a cfg/server.cfg UNA vez y completa tus valores (busca "CHANGE ME").
//     Las actualizaciones solo traen este ejemplo, así tu server.cfg real nunca se sobrescribe.
//     Hecho a partir del server.cfg del repo competitivo, el server.cfg y el tutorial de Harry
//     Potter, y la lista de cvars de la wiki de Valve. server.cfg se ejecuta en CADA cambio de mapa.
// =====================================================================================


// ---- Name and remote access / Nombre y acceso remoto ----------------------------------

hostname "Lefordianos"                     // CHANGE ME / CAMBIAME

// RCON password (remote admin). Long and private. "" = RCON off.
// Contraseña de RCON (administrar a distancia). Larga y privada. "" = RCON apagado.
rcon_password ""                           // CHANGE ME / CAMBIAME
// Ban an IP for 12 h after 5 wrong RCON passwords (Harry). Default 0 = never.
// Banea una IP por 12 h tras 5 contraseñas de RCON incorrectas (Harry). Por defecto 0 = nunca.
sv_rcon_minfailures 5
sv_rcon_maxfailures 5
sv_rcon_banpenalty 720

// Server password. Leave "" or randoms can't join. / Contraseña. Déjala "" o los randoms no entran.
sv_password ""

// Valve may overwrite motd.txt/host.txt on updates; edit these copies instead.
// Valve puede sobrescribir motd.txt/host.txt al actualizar; edita estas copias.
motdfile "mymotd.txt"
hostfile "myhost.txt"


// ---- Finding the server / Encontrar el servidor ---------------------------------------

// Your Steam group's ID (numbers). Lets group members find the server from the lobby.
// El ID (números) de tu grupo de Steam. Los del grupo encuentran el servidor desde el lobby.
sv_steamgroup ""                           // CHANGE ME (optional / opcional)
// 1 = when the server is empty, only group members can start a game on it. 0 = anyone (randoms).
// 1 = con el servidor vacío, solo los del grupo pueden empezar partida. 0 = cualquiera (randoms).
sv_steamgroup_exclusive 0

// sv_search_key: lobbies only find servers with the same key. It would hide us from randoms'
// matchmaking, so we DON'T set it. / Los lobbies solo encuentran servidores con la misma clave.
// Nos escondería del matchmaking de los randoms, así que NO la ponemos.
// sv_search_key "lefordianos"

// Region for Steam's server list and matchmaking. -1 = none (default). CHANGE ME:
// Región para la lista de servidores y el matchmaking de Steam. -1 = ninguna. CAMBIAME:
//   0 US East, 1 US West, 2 South America, 3 Europe, 4 Asia, 5 Australia, 6 Middle East, 7 Africa, 255 World
// sv_region 2


// ---- Lobbies and slots / Lobbies y lugares --------------------------------------------

// 1 (game default) = players can only join from a matchmaking lobby, not by "connect".
// 0 = lobby AND direct connect / server browser / friends. Also needed for sv_cheats (testing).
// The competitive repo uses 0. Harry uses 1 together with l4d_unreservelobby (9+ players).
// If randoms stop arriving from matchmaking with 0, try 1 (see IDEAS: lobby reservation).
// 1 (por defecto) = solo se entra desde un lobby de matchmaking, no con "connect".
// 0 = lobby Y "connect" / lista de servidores / amigos. También hace falta para sv_cheats (pruebas).
// El repo competitivo usa 0. Harry usa 1 junto con l4d_unreservelobby (9+ jugadores).
// Si con 0 dejan de llegar randoms del matchmaking, prueba 1 (ver IDEAS: reserva del lobby).
sv_allow_lobby_connect_only 0

// More than 8 players needs l4dtoolz (on hold, see IDEAS). With lakwsh's l4dtoolz:
// Más de 8 jugadores necesita l4dtoolz (en espera, ver IDEAS). Con el l4dtoolz de lakwsh:
// sv_setmax 31                 // all clients incl. bots; also +sv_setmax 31 in the launch options
// sv_maxplayers 10             // humans / humanos (8 playing + 2 spectating / 8 jugando + 2 mirando)
// sv_visiblemaxplayers 10
// sv_force_unreserved 0
// sv_steam_bypass 0            // 1 only while the "No Steam logon" error is happening (breaks SteamID checks)
//                              // 1 solo mientras pasa el error "No Steam logon" (rompe la verificación de SteamID)


// ---- Game / Juego -----------------------------------------------------------------------

// Voice between teams. Vanilla versus: 0. Votable in !votes.
// Voz entre equipos. Versus vanilla: 0. Se puede votar en !votes.
sv_alltalk 0
// The engine's own pause stays off; pause.smx turns it on only while it pauses (pause by vote).
// La pausa del motor queda apagada; pause.smx la prende solo mientras pausa (pausa por votación).
sv_pausable 0
sv_voiceenable 1
// Clients can't use the "wait" command (used in scripts/binds for frame-perfect tricks).
// Los clientes no pueden usar el comando "wait" (se usa en scripts/binds para trucos al frame).
sm_cvar sv_allow_wait_command 0


// ---- Files and addons / Archivos y addons ----------------------------------------------

// Check that critical game files (models, materials) weren't modified. Game default 1.
// Revisa que los archivos críticos del juego (modelos, materiales) no estén modificados. Por defecto 1.
sv_consistency 1

// Players' workshop addons (skins, sounds, HUDs). From Left4DHooks:
//   -1 = vanilla (each addon's own setting), 0 = addons off for everyone (competitive repo), 1 = all on.
// 0 is fairer (some addons give advantages: brighter maps, louder infected, see-through props) but
// randoms lose their skins. / Addons del workshop de los jugadores (skins, sonidos, HUD). De Left4DHooks:
//   -1 = vanilla (lo que diga cada addon), 0 = addons apagados para todos (repo competitivo), 1 = todos.
// 0 es más justo (algunos addons dan ventaja: mapas más claros, infectados más ruidosos, props
// transparentes) pero los randoms pierden sus skins.
// Decided 2026-10-03: 0. Set in lefordianos/common.cfg so it applies with any server.cfg.
// Decidido el 2026-10-03: 0. Está en lefordianos/common.cfg para que aplique con cualquier server.cfg.
// sm_cvar l4d2_addons_eclipse 0

// Stricter: client files must come from Steam (competitive repo). Kicks players with modified files.
// Más estricto: los archivos del cliente deben venir de Steam (repo competitivo). Expulsa a quien tenga
// archivos modificados.
// sv_pure 2
// sv_pure_kick_clients 1


// ---- Logs ------------------------------------------------------------------------------

log on
sv_logecho 0
sv_logfile 1
sv_log_onefile 0
sv_logbans 1
sv_logflush 0
sv_logsdir logs


// ---- Performance / Rendimiento -----------------------------------------------------------

// Load everything at map start instead of mid-game (a bit more RAM, fewer hitches). Default 0.
// Carga todo al empezar el mapa en vez de durante la partida (algo más de RAM, menos tirones). Por defecto 0.
sm_cvar sv_forcepreload 1
// Don't leave players stuck inside things after lag compensation. Default 0.
// No dejar jugadores trabados dentro de cosas después de la compensación de lag. Por defecto 0.
sm_cvar sv_unlag_fixstuck 1
// Limit server-browser queries (stops query floods). From the competitive repo.
// Limita las consultas de la lista de servidores (frena inundaciones). Del repo competitivo.
sm_cvar sv_max_queries_sec_global 20
sm_cvar sv_max_queries_sec 3
sm_cvar sv_max_queries_window 10

// Tickrate and network rates: we play at the default 30 tick for now, so the competitive repo's
// 100-tick rates (sv_minrate 100000, sv_mincmdrate 100...) do NOT belong here. See IDEAS: Tickrate.
// Tickrate y rates de red: por ahora jugamos con los 30 tick por defecto, así que los rates de 100
// tick del repo competitivo (sv_minrate 100000, sv_mincmdrate 100...) NO van acá. Ver IDEAS: Tickrate.


// ---- Lefordianos (keep this last / deja esto al final) ------------------------------------

exec lefordianos/server_base.cfg
