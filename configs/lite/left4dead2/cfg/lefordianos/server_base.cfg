// =====================================================================================
// Lefordianos lite config - server base / base del servidor
// Add this line at the END of your cfg/server.cfg / Agrega esta linea al FINAL de tu cfg/server.cfg:
//     exec lefordianos/server_base.cfg
// Only engine/extension settings that exist at server start go here; plugin settings are in
// lefordianos/common.cfg (run on every map by gamemode-based_configs).
// Aca solo van ajustes del motor/extensiones que existen al arrancar; los de plugins estan en
// lefordianos/common.cfg (se ejecuta en cada mapa con gamemode-based_configs).
// =====================================================================================

// Stripper:Source reads our map changes from here / Stripper lee nuestros cambios de mapas de aca
stripper_cfg_path "cfg/stripper/lefordianos"

// Downloads (custom sounds) - see docs/FASTDL.md / Descargas (sonidos propios) - ver docs/FASTDL.es.md
// L4D2 hides these from cfg files ("Unknown command"), so they go through sm_cvar (Harry's tip).
// L4D2 los esconde de los cfg ("Unknown command"), por eso van con sm_cvar (dato de Harry).
sm_cvar sv_allowdownload 1
// sm_cvar sv_downloadurl "http://YOUR-IP:27080/"

// Tickrate is parked (see IDEAS.md). Default 30 tick needs nothing here.
// El tickrate esta en pausa (ver IDEAS.es.md). Con 30 tick (por defecto) no hace falta nada aca.
