// =====================================================================================
// Lefordianos lite config - server base / base del servidor
// Add this line at the END of your cfg/server.cfg / Agrega esta línea al FINAL de tu cfg/server.cfg:
//     exec lefordianos/server_base.cfg
// Only engine/extension settings that exist at server start go here; plugin settings are in
// lefordianos/common.cfg (run on every map by gamemode-based_configs).
// Acá solo van ajustes del motor/extensiones que existen al arrancar; los de plugins están en
// lefordianos/common.cfg (se ejecuta en cada mapa con gamemode-based_configs).
// =====================================================================================

// Stripper:Source reads our map changes from here / Stripper lee nuestros cambios de mapas de acá
stripper_cfg_path "cfg/stripper/lefordianos"

// Downloads (custom sounds) - see docs/FASTDL.md / Descargas (sonidos propios) - ver docs/FASTDL.es.md
sv_allowdownload 1
// sv_downloadurl "http://YOUR-IP:27080/"

// Tickrate is parked (see IDEAS.md). Default 30 tick needs nothing here.
// El tickrate está en pausa (ver IDEAS.es.md). Con 30 tick (por defecto) no hace falta nada acá.
