// =====================================================================================
// Lefordianos lite config - settings for every game mode / ajustes para todos los modos
// Run on every map by Harry Potter's gamemode-based_configs, through the mode files in
// cfg/sourcemod/gamemode_cvars/ (all of them start with: exec lefordianos/common.cfg).
// Lo ejecuta en cada mapa el gamemode-based_configs de Harry Potter, a traves de los archivos
// de cfg/sourcemod/gamemode_cvars/ (todos empiezan con: exec lefordianos/common.cfg).
// =====================================================================================

// ---- ZoneMod values for the gameplay plugins we chose (decided 2026-10-02) ----
// ---- Valores de ZoneMod para los plugins de juego elegidos (decidido el 2026-10-02) ----
// Not copied on purpose / No copiados a proposito: sm_witch_can_spawn 0, l4d_witch_percent 0
// (ZoneMod has no flow witches; we keep them / ZoneMod no tiene witches por %; nosotros si)

// [l4d2_spit_spread_patch]
sm_cvar l4d2_spit_spread_saferoom "1"
sm_cvar l4d2_deathspit_trace_height "9999.9"
sm_cvar l4d2_spit_water_collision "1"

// [l4d2_rock_trace_unblock]
sm_cvar l4d2_rock_trace_unblock_flag "1"
sm_cvar l4d2_rock_jockey_dismount "0"

// [l4d_prop_touching_rules]
sm_cvar prop_moveaway_mass_thres "150.0"

// [l4d2_dominatorscontrol]
// Quad caps possible (smoker + hunter + jockey + charger up at once), like ZoneMod. The default (53)
// counts those four as "dominators" and the game never allows more than 3 at once (vanilla rule).
// Chosen balance change, 2026-10-04. / Quad caps posibles, como en ZoneMod. Con el valor por defecto (53)
// el juego nunca deja mas de 3 de esos a la vez (regla de vanilla). Cambio de balance elegido.
sm_cvar l4d2_dominators "0"

// Special infected break a door with one hit, like ZoneMod (game default 60; ZoneMod 160). Hunter pounces
// on doors already do 500 by default. Chosen balance change, 2026-10-08.
// Los infectados especiales rompen una puerta de un golpe, como en ZoneMod (por defecto 60; ZoneMod 160).
// El salto del hunter contra una puerta ya hace 500 por defecto. Cambio de balance elegido.
sm_cvar z_door_pound_damage "160"

// End of a versus campaign: seconds to vote on the end screen (play again / lobby) before lef_campaigns
// moves on to the next campaign. Game default 12, which left no time to vote.
// Fin de una campana de versus: segundos para votar en la pantalla final (jugar de nuevo / lobby) antes
// de que lef_campaigns pase a la siguiente campana. Por defecto 12, que no dejaba tiempo de votar.
sm_cvar sv_pz_endgame_vote_period "30"

// [l4d_vomit_trace_patch]
// Keep its fix (infected teammates don't block the vomit) but use vanilla hit detection: with 1 the vomit
// must hit a survivor's exact hitbox instead of the game's bigger bounding box, and players felt the
// vomit range was shorter (2026-10-03). / Mantiene su arreglo (los infectados no bloquean el vomito) pero
// con la deteccion de vanilla: con 1 el vomito debe dar en el hitbox exacto en vez de la caja mas grande
// del juego, y los jugadores sentian que el vomito llegaba menos lejos.
sm_cvar vomit_collide_strict "0"

// [l4d2_car_alarm_hittable_fix]
sm_cvar l4d2_car_alarm_touch_capped "0"

// [lerpmonitor]
sm_cvar sm_allowed_lerp_changes "3"
// Up to 100 ms: the game's default lerp at 30 tick (cl_interp 0.1). ZoneMod's 67 ms is for 100-tick
// servers and moved players with default settings to spectators. 0.101 leaves room for rounding.
// Hasta 100 ms: el lerp por defecto del juego a 30 tick (cl_interp 0.1). Los 67 ms de ZoneMod son para
// servidores de 100 tick y mandaban a espectadores a quien tenia los ajustes por defecto.
sm_cvar sm_max_lerp "0.101"

// [l4d2_skill_detect]
sm_cvar sm_skill_report_enable "1"
// Every skill report in chat (decided 2026-10-04; most are off by default).
// Todas las jugadas destacadas en el chat (decidido el 2026-10-04; casi todas vienen apagadas).
sm_cvar sm_skill_report_skeet "1"
sm_cvar sm_skill_report_hurtskeet "1"
sm_cvar sm_skill_report_level "1"
sm_cvar sm_skill_report_hurtlevel "1"
sm_cvar sm_skill_report_crow "1"
sm_cvar sm_skill_report_drawcrow "1"
sm_cvar sm_skill_report_tonguecut "1"
sm_cvar sm_skill_report_sc "1"
sm_cvar sm_skill_report_scs "1"
sm_cvar sm_skill_report_rockskeet "1"
sm_cvar sm_skill_report_rockname "1"
sm_cvar sm_skill_report_deadstop "1"
sm_cvar sm_skill_report_pop "1"
sm_cvar sm_skill_report_shove "1"
sm_cvar sm_skill_report_hunterdp "1"
sm_cvar sm_skill_report_jockeydp "1"
sm_cvar sm_skill_report_deadcharger "1"
sm_cvar sm_skill_report_instanclear "1"
sm_cvar sm_skill_report_bhop "1"
sm_cvar sm_skill_report_caralarm "1"

// [l4d2_playstats]
sm_cvar sm_survivor_mvp_brevity_latest "111"
sm_cvar sm_stats_autoprint_vs_round "8372"

// [l4d2_getup_fixes]
sm_cvar gfc_long_charger_duration "3.1"

// [l4d2_godframes_control_merge]
sm_cvar gfc_ff_min_time "0.8"
sm_cvar gfc_spit_extra_time "0.4"
sm_cvar gfc_common_extra_time "0.6"
sm_cvar gfc_hunter_duration "1.5"
sm_cvar gfc_jockey_duration "0"
sm_cvar gfc_smoker_duration "0"
sm_cvar gfc_charger_stagger_extra_time "0.5"
sm_cvar gfc_charger_stagger_flags "2"
sm_cvar gfc_common_zc_flags "9"
sm_cvar l4d2_shotgun_ff_max "8.0"

// [l4d2_tank_attack_control]
sm_cvar l4d2_block_jump_rock "1"

// [l4d2_antibaiter]
sm_cvar l4d2_antibaiter_delay "15"
sm_cvar l4d2_antibaiter_horde_timer "30"
sm_cvar l4d2_antibaiter_bile_stop "1"

// [l4d2_collision_adjustments]
sm_cvar collision_tankrock_incap "1"

// [l4d2_tank_horde_monitor]
sm_cvar l4d2_tank_bypass_extra_flow "1500"

// ---- Maps whose tank/witch are scripted by the map: no extra flow boss there (from ZoneMod) ----
// ---- Mapas con tank/witch programados por el mapa: ahi no se agrega otro jefe por % (de ZoneMod) ----
reset_static_maps
static_tank_map c13m4_cutthroatcreek
static_tank_map c1m4_atrium
static_tank_map c4m5_milltown_escape
static_tank_map c5m5_bridge
static_tank_map c6m3_port
static_tank_map c7m1_docks
static_tank_map c7m3_port
static_tank_map cdta_05finalroad
static_tank_map dc2025_4
static_tank_map dc2025_5
static_tank_map dcr_m4_atrium
static_tank_map dkr_m1_motel
static_tank_map dkr_m2_carnival
static_tank_map dkr_m3_tunneloflove
static_tank_map dkr_m4_ferris
static_tank_map dkr_m5_stadium
static_tank_map dprm5_milltown_escape
static_tank_map l4d2_darkblood04_extraction
static_tank_map l4d2_diescraper4_top_361
static_tank_map l4d_dbd2dc_new_dawn
static_tank_map uf4_airfield
static_tank_map x1m5_salvation
static_witch_map c4m5_milltown_escape
static_witch_map c5m5_bridge
static_witch_map c6m1_riverbank
static_witch_map cdta_05finalroad
static_witch_map dkr_m1_motel
static_witch_map dkr_m2_carnival
static_witch_map dkr_m3_tunneloflove
static_witch_map dkr_m4_ferris
static_witch_map dkr_m5_stadium
static_witch_map hf01_theforest
static_witch_map hf04_escape
static_witch_map l4d2_stadium5_stadium
static_witch_map x1m5_salvation

// ---- Our plugins / Nuestros plugins ----
// Tank and witch chance per map, same for both teams (decided 2026-10-02: 50% each).
// Changes apply from the next map (the roll happens when a map starts).
// Probabilidad de tank y witch por mapa, igual para ambos equipos (decidido el 2026-10-02: 50% cada uno).
// Los cambios se aplican desde el proximo mapa (el sorteo se hace al empezar el mapa).
sm_cvar lef_boss_tank_chance "50"
sm_cvar lef_boss_witch_chance "50"
// T1-only mode starts off; turn it on with !t1 (vote) or sm_forcet1 on.
// El modo solo T1 empieza apagado; se prende con !t1 (votacion) o sm_forcet1 on.
sm_cvar lef_t1_enable "0"
// Tank horde monitor installed but OFF (undecided). 1 = on. / Instalado pero APAGADO (sin decidir). 1 = prendido.
sm_cvar l4d2_tank_horde_monitor_enable "0"

// Client cvars that give an advantage (fullbright, no fog...): kick. List from ZoneMod.
// Cvars de cliente que dan ventaja (brillo total, sin niebla...): expulsion. Lista de ZoneMod.
exec lefordianos/client_cvars.cfg

// Players' workshop addons off for everyone (some give advantages: brighter maps, see-through props).
// Decided 2026-10-03. -1 = vanilla. From Left4DHooks.
// Addons del workshop de los jugadores apagados para todos (algunos dan ventaja: mapas mas claros,
// props transparentes). Decidido el 2026-10-03. -1 = vanilla. De Left4DHooks.
sm_cvar l4d2_addons_eclipse "0"

// ---- Other plugins / Otros plugins ----
// Harry's spawn notifier: chat + sound when a witch spawns. Tanks are already announced by
// l4d2_tank_announce, so its tank message is off. / Aviso de Harry: chat + sonido cuando aparece una
// witch. Los tanks ya los anuncia l4d2_tank_announce, asi que su aviso de tank queda apagado.
sm_cvar tank_witch_spawn_notify_tank_announce "0"
sm_cvar tank_witch_spawn_notify_tank_sound_file ""
// The witch has her own sound: the tank notice already uses ui/pickup_secret01.wav (players mixed them up).
// La witch tiene su propio sonido: el aviso del tank ya usa ui/pickup_secret01.wav (los confundian).
sm_cvar tank_witch_spawn_notify_witch_sound_file "music/witch/lost_little_witch_01a.wav"
// Harry's tank pass: one pass per tank / Pasar tank de Harry: un pase por tank
sm_cvar l4d_tank_pass_count "1"
// Little Anti-Cheat: log only, no bans, for the first weeks / Solo registra, sin baneos, las primeras semanas
sm_cvar lilac_ban "0"
// Server messages every 2 minutes / Mensajes del servidor cada 2 minutos
sm_cvar smd_advertisements_interval "120"
// Vote_Mode: its own chat/menu vote (!votemode) only for root admins; players use !votes > Change game
// mode, which votes on the F1/F2 screen and then has Vote_Mode apply it.
// Vote_Mode: su votacion propia (!votemode) solo para admins root; los jugadores usan !votes.
sm_cvar l4d_votemode_admin_flag "z"
// AFK commands: nobody can join the team that already has more humans (stops 2v4 from a 2v3).
// Comandos AFK: nadie puede unirse al equipo que ya tiene mas humanos (evita un 2v4 desde un 2v3).
sm_cvar l4d_afk_commands_versus_teams_unbalance_limit "1"
// The M key (team menu) works again: it goes through the same rules as !survivors / !infected
// (balance, cooldowns). Its default blocked it with "This function has been blocked!" (2026-10-04).
// La tecla M (menu de equipos) vuelve a funcionar: pasa por las mismas reglas que !survivors / !infected.
sm_cvar l4d_afk_commands_pressM_block "0"

// ---- Your own settings (keep this last) / Tus propios ajustes (deja esto al final) ----
// Runs every map AFTER everything above, so values there win. Copy custom.example.cfg to custom.cfg
// once; updates never ship custom.cfg, so they never overwrite it. (Without it the console just says
// it couldn't exec it.) / Se ejecuta en cada mapa DESPUES de todo lo de arriba, asi sus valores ganan.
// Copia custom.example.cfg a custom.cfg una vez; las actualizaciones nunca traen custom.cfg.
exec lefordianos/custom.cfg
