// =====================================================================================
// Lefordianos - solo testing with bots / pruebas solo con bots
//
// EN: For trying plugins alone (or with a friend) in versus. Run it from the server console or
//     RCON:  exec lefordianos/test_bots.cfg     Undo it with:  exec lefordianos/test_off.cfg
//     It turns on sv_cheats, so never leave it on with randoms. Needs
//     sv_allow_lobby_connect_only 0 in server.cfg. Cvar defaults checked against the Valve wiki.
// ES: Para probar plugins solo (o con un amigo) en versus. Ejecutalo en la consola del servidor o por
//     RCON:  exec lefordianos/test_bots.cfg     Para deshacerlo:  exec lefordianos/test_off.cfg
//     Prende sv_cheats, asi que nunca lo dejes prendido con randoms. Necesita
//     sv_allow_lobby_connect_only 0 en server.cfg. Valores por defecto revisados en la wiki de Valve.
// =====================================================================================

sv_cheats 1

// Let a game run with only bots, and a survivor team of only bots (so you can play infected alone).
// Deja que una partida corra solo con bots, y un equipo sobreviviente de solo bots (para jugar de
// infectado solo).
sm_cvar sb_all_bot_game 1
sm_cvar allow_all_bot_survivor_team 1

// Switch teams as often as you like (versus default: 1 switch). / Cambiar de equipo cuantas veces quieras.
sm_cvar vs_max_team_switches 99

echo "[Lefordianos] Test mode ON (sv_cheats 1). Undo: exec lefordianos/test_off.cfg"

// ---- Handy commands: type them in the console when needed (not run by this file) ----
// ---- Comandos utiles: escribelos en la consola cuando haga falta (este archivo no los ejecuta) ----
//
// Game / Juego:
//   director_force_versus_start      infected can spawn while survivors are still in the saferoom
//                                    los infectados pueden aparecer con los sobrevivientes en el refugio
//   god 1                            survivors take no damage / los sobrevivientes no reciben dano
//   sb_stop 1                        survivor bots stand still / los bots sobrevivientes se quedan quietos
//   sb_dont_shoot 1                  survivor bots don't shoot / los bots sobrevivientes no disparan
//   nb_blind 1                       common infected and witches can't see / comunes y witch no ven
//   director_no_mobs 1               no hordes / sin hordas
//   director_no_specials 1           no special infected / sin infectados especiales
//   director_no_bosses 1             no tank or witch / sin tank ni witch
//   director_no_death_check 1        the round doesn't end when all survivors die / la ronda no termina si mueren todos
//   director_stop                    stop everything the director spawns / detiene todo lo que genera el director
//   z_spawn_old tank auto            spawn a tank (also: witch, hunter, smoker, mob...) / hace aparecer un tank
//   director_force_panic_event       start a horde / inicia una horda
//   warp_to_start_area               back to the start saferoom / volver al refugio inicial
//   sb_add                           add a survivor bot / agrega un bot sobreviviente
//   sv_infinite_ammo 1               infinite ammo / municion infinita
//   host_timescale 0.5               slow motion (1 = normal) / camara lenta (1 = normal)
//
// Our plugins / Nuestros plugins:
//   sm_givetank <player>             that player gets the next tank / ese jugador recibe el proximo tank
//   !admin > Lefordianos             run any vote option instantly (e.g. tank and witch every map)
//                                    hacer cualquier opcion de votacion al instante (ej. tank y witch siempre)
//   sm_bosses                        this map's tank and witch spots / donde salen tank y witch
//   sm_forcet1 on|off                T1-only mode / modo solo T1
//   sm_votes, sm_menu, sm_wait       the player menus / los menus de jugadores
//   sm_roster, sm_balanceteams       roster levels, balanced shuffle / niveles del roster, mezcla balanceada
//   sm_clientcvars                   client cvars being checked / cvars de cliente que se revisan
//   sm_checkbans <player>            ask Steam about bans again / volver a preguntar a Steam por baneos
//   stripper_dump                    write this map's entities to a file (Stripper) / guarda las entidades del mapa
//
// Note: settings typed with sm_cvar (like lef_boss_tank_chance) go back to the configs on the next
// map; votes and !admin > Lefordianos are remembered until the server empties.
// Nota: los ajustes escritos con sm_cvar (como lef_boss_tank_chance) vuelven a las configs en el proximo
// mapa; las votaciones y !admin > Lefordianos se recuerdan hasta que el servidor se vacia.
