// lef_mode_plugins: plugins turned off while a game mode is on, and back on when it ends.
// lef_mode_plugins: plugins que se apagan mientras un modo de juego esta activo, y vuelven al salir.
//
// "<mp_gamemode>" { "off" "<file under addons/sourcemod/plugins/>" ... }
// Put plugins other plugins depend on first: they're turned off last and back on first.
// Poner primero los plugins de los que dependen otros: se apagan al final y vuelven primero.
"ModePlugins"
{
	// Taaannnk!! (all infected are tanks; lef_tanktime runs it). These decide who gets the tank, which
	// class spawns, whether a tank spawns at all, or announce every tank.
	// Todos los infectados son tanks (lo maneja lef_tanktime). Estos deciden quien es tank, que clase
	// aparece, si sale tank, o anuncian cada tank.
	"mutation19"
	{
		"off"	"lefordianos/l4d_boss_percent.smx"
		"off"	"lefordianos/witch_and_tankifier.smx"
		"off"	"lefordianos/l4d_tank_control_eq.smx"
		"off"	"lefordianos/lef_boss_spawns.smx"
		"off"	"lefordianos/l4d2_fix_spawn_order.smx"
		"off"	"lefordianos/l4d2_tank_announce.smx"
		"off"	"lefordianos/l4d_tank_damage_announce.smx"
		"off"	"lefordianos/l4d2_tankrage.smx"
		"off"	"lefordianos/l4d2_antibaiter.smx"
	}
}
