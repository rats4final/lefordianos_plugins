// Lefordianos Votes: everything players can vote on with !votes (and admins can run from !admin).
//
// Groups hold entries. Each entry:
//   "title"      { "en" "..." "es" "..." }   menu text; the vote screen uses the server's language
//   "type"       command | client | map | restart | kick | spec | mute | pause   (default: command)
//   "command"    for "command": what the server runs if the vote passes
//                for "client":  the command opened for the player (another plugin's menu, no vote here);
//                               hidden when that command doesn't exist
//   "admin_only" "1" = only in the admin menu
//   "persist"    for "command": remember it for the session under this name, so a map change (which
//                re-runs the server configs) doesn't undo it. Entries that replace each other share
//                the name; the latest wins. Forgotten once the server is empty.
//   "finale_only" "1" = only shown on a campaign's last map (ACS only votes the next campaign there)
//   "enabled"    "0" = hide it
//
// Reload after editing: sm_votes_reload

"Votes"
{
	"maps"
	{
		"title" { "en" "Maps" "es" "Mapas" }

		"changemap"
		{
			"title"   { "en" "Change map" "es" "Cambiar mapa" }
			"type"    "map"
		}
		"restart"
		{
			"title"   { "en" "Restart this map" "es" "Reiniciar este mapa" }
			"type"    "restart"
		}
		"nextcampaign"
		{
			"title"   { "en" "Next campaign (pick one)" "es" "Próxima campaña (elegir una)" }
			"type"    "client"
			"command" "mapvote"
			"finale_only" "1"
		}
		"gamemode"
		{
			"title"   { "en" "Change game mode" "es" "Cambiar modo de juego" }
			"type"    "client"
			"command" "sm_votemode"
		}
	}

	"teams"
	{
		"title" { "en" "Teams" "es" "Equipos" }

		"shuffle"
		{
			"title"   { "en" "Shuffle teams" "es" "Mezclar equipos" }
			"command" "sm_shuffleteams"
		}
		"balance"
		{
			"title"   { "en" "Balanced shuffle" "es" "Mezcla balanceada" }
			"command" "sm_balanceteams"
		}
		"flip"
		{
			"title"   { "en" "Swap survivors and infected" "es" "Intercambiar sobrevivientes e infectados" }
			"command" "sm_flipteams"
		}
		"restoreteams"
		{
			"title"   { "en" "Restore last round's teams" "es" "Volver a los equipos de la ronda pasada" }
			"command" "sm_restoreteams"
		}
	}

	"players"
	{
		"title" { "en" "Players" "es" "Jugadores" }

		"kick"
		{
			"title"   { "en" "Kick player" "es" "Expulsar jugador" }
			"type"    "kick"
		}
		"spec"
		{
			"title"   { "en" "Move player to spectators (AFK)" "es" "Mover jugador a espectadores (AFK)" }
			"type"    "spec"
		}
		"mute"
		{
			"title"   { "en" "Mute player (voice and chat)" "es" "Silenciar jugador (voz y chat)" }
			"type"    "mute"
		}
	}

	"rules"
	{
		"title" { "en" "Rules" "es" "Reglas" }

		"bosses0"
		{
			"title"   { "en" "Tank and witch: never" "es" "Tank y witch: nunca" }
			"command" "lef_boss_tank_chance 0; lef_boss_witch_chance 0"
			"persist" "bosses"
		}
		"bosses50"
		{
			"title"   { "en" "Tank and witch: 50% of maps" "es" "Tank y witch: 50% de los mapas" }
			"command" "lef_boss_tank_chance 50; lef_boss_witch_chance 50"
			"persist" "bosses"
		}
		"bosses100"
		{
			"title"   { "en" "Tank and witch: every map" "es" "Tank y witch: todos los mapas" }
			"command" "lef_boss_tank_chance 100; lef_boss_witch_chance 100"
			"persist" "bosses"
		}
		"t1on"
		{
			"title"   { "en" "T1 weapons only: on" "es" "Solo armas T1: activar" }
			"command" "sm_forcet1 on"
		}
		"t1off"
		{
			"title"   { "en" "T1 weapons only: off" "es" "Solo armas T1: desactivar" }
			"command" "sm_forcet1 off"
		}
		"hordeon"
		{
			"title"   { "en" "No horde while the tank is up: on" "es" "Sin horda mientras está el tank: activar" }
			"command" "l4d2_tank_horde_monitor_enable 1"
			"persist" "horde"
		}
		"hordeoff"
		{
			"title"   { "en" "No horde while the tank is up: off" "es" "Sin horda mientras está el tank: desactivar" }
			"command" "l4d2_tank_horde_monitor_enable 0"
			"persist" "horde"
		}
	}

	"game"
	{
		"title" { "en" "Game" "es" "Partida" }

		"pause"
		{
			"title"   { "en" "Pause the game" "es" "Pausar la partida" }
			"type"    "pause"
		}
		"alltalkon"
		{
			"title"   { "en" "All talk: on" "es" "Voz entre equipos: activar" }
			"command" "sv_alltalk 1"
			"persist" "alltalk"
		}
		"alltalkoff"
		{
			"title"   { "en" "All talk: off" "es" "Voz entre equipos: desactivar" }
			"command" "sv_alltalk 0"
			"persist" "alltalk"
		}
	}
}
