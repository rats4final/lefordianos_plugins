// Lefordianos Menu: what players see in !menu (or !lef).
//
// Groups hold entries. Each entry:
//   "title"   { "en" "..." "es" "..." }
//   "command" what runs for the player when they pick it, as if they had typed it in console
//   "finale_only" "1" = only on a campaign's last map
//   "enabled" "0" = hide it
// Entries whose command doesn't exist on the server (plugin not installed) are hidden on their own.
//
// Reload after editing: sm_menu_reload

"Menu"
{
	"teams"
	{
		"title" { "en" "Teams" "es" "Equipos" }

		"teams"      { "title" { "en" "Who is on each team" "es" "Quién está en cada equipo" }         "command" "sm_teams" }
		"lastteams"  { "title" { "en" "Last round's teams" "es" "Equipos de la ronda pasada" }        "command" "sm_lastteams" }
		"swapwith"   { "title" { "en" "Trade places with a player" "es" "Cambiar de lugar con un jugador" } "command" "sm_swapwith" }
		"survivors"  { "title" { "en" "Join survivors" "es" "Unirse a sobrevivientes" }              "command" "sm_survivors" }
		"infected"   { "title" { "en" "Join infected" "es" "Unirse a infectados" }                   "command" "sm_infected" }
		"afk"        { "title" { "en" "Go to spectators (AFK)" "es" "Ir a espectadores (AFK)" }       "command" "sm_afk" }
	}

	"votes"
	{
		"title" { "en" "Votes" "es" "Votaciones" }

		"votes"      { "title" { "en" "Start a vote" "es" "Iniciar una votación" }                    "command" "sm_votes" }
		"nextcampaign" { "title" { "en" "Pick the next campaign" "es" "Elegir la próxima campaña" }    "command" "mapvote" "finale_only" "1" }
		"t1"         { "title" { "en" "Vote T1 weapons only on/off" "es" "Votar solo armas T1 sí/no" } "command" "sm_t1" }
		"gamemode"   { "title" { "en" "Vote a game mode" "es" "Votar un modo de juego" }               "command" "sm_votemode" }
	}

	"info"
	{
		"title" { "en" "Match info" "es" "Info de la partida" }

		"rank"       { "title" { "en" "My ranking" "es" "Mi ranking" }                                  "command" "sm_rank" }
		"top"        { "title" { "en" "Top 10" "es" "Top 10" }                                           "command" "sm_top" }
		"score"      { "title" { "en" "Scores" "es" "Puntajes" }                                       "command" "sm_score" }
		"bosses"     { "title" { "en" "Tank and witch on this map" "es" "Tank y witch en este mapa" }  "command" "sm_bosses" }
		"tank"       { "title" { "en" "Who becomes the tank" "es" "Quién será el tank" }               "command" "sm_tank" }
		"comeback"   { "title" { "en" "Comeback bonus" "es" "Bono de remontada" }                      "command" "sm_comeback" }
	}

	"game"
	{
		"title" { "en" "Game" "es" "Partida" }

		"wait"       { "title" { "en" "Wait for a friend before starting (!wait)" "es" "Esperar a un amigo antes de empezar (!wait)" } "command" "sm_wait" }
		"pause"      { "title" { "en" "Pause (starts a vote)" "es" "Pausar (inicia una votación)" }   "command" "sm_pause" }
		"ready"      { "title" { "en" "Ready to unpause" "es" "Listos para quitar la pausa" }        "command" "sm_ready" }
		"clientcvars" { "title" { "en" "Client settings the server checks" "es" "Ajustes del cliente que revisa el servidor" } "command" "sm_clientcvars" }
	}
}
