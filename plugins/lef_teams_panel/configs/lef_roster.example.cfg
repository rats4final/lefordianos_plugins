// Lefordianos roster: our regulars, for the balanced shuffle (!admin > Team Management, or sm_balanceteams).
//
// THIS IS AN EXAMPLE. Copy it to lef_roster.cfg (same folder) on the server and fill that one in.
// Updates ship only this example, so they never overwrite your real list.
//
// One entry per player. The key is their SteamID in any format:
//   "STEAM_1:0:12345678"   (STEAM_0: works too)
//   "[U:1:24691357]"
//   "76561198000000000"
// Find it in the server console with "status", or with sm_roster once they're on the server.
//
//   "name"   just a reminder of who it is (shown by sm_roster)
//   "level"  how strong they play, 1 (new) to 5 (best). Optional: missing = lef_teams_roster_level (3).
// Players not listed here count as lef_teams_random_level (2).
//
// The shuffle tries every way to split the players and picks the one where both teams' levels add up
// closest; between equally good splits it spreads the regulars evenly and then picks at random.
// Reload after editing: sm_roster_reload

"Roster"
