// Lefordianos T1 Mode: which weapons are replaced while T1-only mode is on, and by what.
// Format: "banned weapon"  "replacement"   ("none" removes the weapon instead)
// Weapons not listed here are allowed. Reload with sm_t1_reload after editing.
//
// Modo T1 de Lefordianos: qué armas se reemplazan mientras el modo solo T1 está activo, y por cuál.
// Formato: "arma prohibida"  "reemplazo"   ("none" quita el arma)
// Las armas que no están acá se permiten. Recarga con sm_t1_reload después de editar.
"T1Mode"
{
	// Rifles -> SMGs
	"rifle"             "smg"
	"rifle_ak47"        "smg_silenced"
	"rifle_desert"      "smg"
	"rifle_sg552"       "smg_silenced"

	// Auto shotguns -> pump shotguns
	"autoshotgun"       "pumpshotgun"
	"shotgun_spas"      "shotgun_chrome"

	// 15 and 30 round snipers -> Scout (the Scout and AWP stay allowed)
	"hunting_rifle"     "sniper_scout"
	"sniper_military"   "sniper_scout"

	// Allowed by default. Uncomment to ban them too:
	// Permitidas por defecto. Descomenta para prohibirlas también:
	// "sniper_awp"        "sniper_scout"
	// "grenade_launcher"  "none"
	// "rifle_m60"         "smg"
}
